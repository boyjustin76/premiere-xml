name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      # The quickstart in the README must keep working.
      - run: premiere-xml examples/cutlist.sample.json -o /tmp/out.xml
        if: runner.os != 'Windows'
      - run: premiere-xml examples/cutlist.sample.json -o out.xml
        if: runner.os == 'Windows'
