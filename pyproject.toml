[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "premiere-xml"
version = "0.1.0"
description = "Build Premiere Pro-importable FCP7 (xmeml) sequences from a JSON cut list. No dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "JungChan LEE" }]
keywords = [
    "premiere-pro", "adobe-premiere", "fcp7", "fcpxml", "xmeml",
    "video-editing", "edl", "nle", "timeline", "automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Source = "https://github.com/boyjustin76/premiere-xml"
Issues = "https://github.com/boyjustin76/premiere-xml/issues"

[project.scripts]
premiere-xml = "premiere_xml.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
